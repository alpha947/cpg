spring.application.name=si
# PostgreSQL local. Override DB_PASSWORD (and the other DB_* values) per environment.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clinique_pasteur_guinee}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Let Hibernate validate an existing schema without changing it on startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# spring.profile.active=dev

# The bundled compose.yaml is only a template and must not override the local database.
spring.docker.compose.lifecycle-management=none
