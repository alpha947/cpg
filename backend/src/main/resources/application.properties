spring.application.name=si

# PostgreSQL local. Override DB_* per environment.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clinique_pasteur_guinee}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Alp01011997}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is owned by Flyway migrations; Hibernate only validates against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# The bundled compose.yaml is only a template and must not override the local database.
spring.docker.compose.lifecycle-management=none

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JSON Web Token settings.
# app.jwt.secret must be a base64-encoded key of at least 256 bits in production.
# When left blank a random key is generated at startup (dev convenience only -
# every restart invalidates existing sessions and the app logs a warning).
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-ttl-minutes=${JWT_ACCESS_TTL_MIN:15}
app.jwt.refresh-token-ttl-days=${JWT_REFRESH_TTL_DAYS:7}

# Bootstrap super-administrator account, created once on first startup if no
# SUPER_ADMIN user exists yet. If SUPERADMIN_PASSWORD is not set, a random
# password is generated and printed once to the startup log.
app.superadmin.email=${SUPERADMIN_EMAIL:admin@cliniquepasteurguinee.com}
app.superadmin.password=${SUPERADMIN_PASSWORD:}

# Comma-separated list of origins allowed to call the API from a browser.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Set to false only for local HTTP development so the refresh-token cookie
# can be set without TLS. Must be true in every deployed environment.
app.security.cookie-secure=${COOKIE_SECURE:true}
